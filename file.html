<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Orbit Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page-shell">
        <section class="calculator" aria-label="Calculator">
            <div class="calculator__topbar">
                <span class="brand"><span class="brand__mark">+</span> ORBIT</span>
                <span class="calculator__mode">STANDARD</span>
            </div>

            <div class="screen" aria-live="polite" aria-atomic="true">
                <p class="screen__expression" id="expression">0</p>
                <output class="screen__result" id="result">0</output>
            </div>

            <div class="keypad" aria-label="Calculator keys">
                <button class="key key--function" type="button" data-action="clear" aria-label="Clear all">AC</button>
                <button class="key key--function" type="button" data-action="percent" aria-label="Percent">%</button>
                <button class="key key--function" type="button" data-action="delete" aria-label="Delete last character">⌫</button>
                <button class="key key--operator" type="button" data-value="/" aria-label="Divide">÷</button>

                <button class="key" type="button" data-value="7">7</button>
                <button class="key" type="button" data-value="8">8</button>
                <button class="key" type="button" data-value="9">9</button>
                <button class="key key--operator" type="button" data-value="*" aria-label="Multiply">×</button>

                <button class="key" type="button" data-value="4">4</button>
                <button class="key" type="button" data-value="5">5</button>
                <button class="key" type="button" data-value="6">6</button>
                <button class="key key--operator" type="button" data-value="-" aria-label="Subtract">−</button>

                <button class="key" type="button" data-value="1">1</button>
                <button class="key" type="button" data-value="2">2</button>
                <button class="key" type="button" data-value="3">3</button>
                <button class="key key--operator" type="button" data-value="+" aria-label="Add">+</button>

                <button class="key key--function" type="button" data-action="sign" aria-label="Toggle sign">±</button>
                <button class="key key--zero" type="button" data-value="0">0</button>
                <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
                <button class="key key--equals" type="button" data-action="calculate" aria-label="Equals">=</button>
            </div>

            <p class="keyboard-hint">Use your keyboard for a faster calculation</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
